name: SkillSpector scan

# Scans every skill with NVIDIA SkillSpector (https://github.com/NVIDIA/SkillSpector),
# static analysis only, and attaches the reports to the run. Findings never fail the
# job; a scanner error does. Results are explained in docs/security/skillspector.md.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install SkillSpector v2.12.0
        run: uv tool install git+https://github.com/NVIDIA/skillspector.git@v2.12.0

      - name: Scan every skill
        run: python3 scripts/skillspector_scan.py --out skillspector-report

      - name: Summary
        if: always()
        run: |
          echo "## NVIDIA SkillSpector" >> "$GITHUB_STEP_SUMMARY"
          cat skillspector-report/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skillspector-report
          path: skillspector-report/
          retention-days: 30
