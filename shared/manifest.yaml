# Which departments get a copy of each shared skill (ADR 0004, amendment of 2026-10-11).
#
# The source is shared/skills/<skill>/; scripts/build_shared.py copies it whole into
# <department>/skills/<skill>/ for every department listed. The first department is the
# one the skill came from. A department is listed only when its agents or skills use the
# skill; a department that uses an unslop sub-skill also gets `unslop`, whose five
# principles every sub-skill applies first.
#
# Edit this file or a source, then run: python3 scripts/build_shared.py

skills:
  orchestration-workstream: [software, chief-of-staff, accounting, compliance, decision-playbooks, finance, learning, marketing, personal, process-engineering, productivity, projects, recurring-summaries, reporting, sales, strategy, toolbox-maintenance]
  task-stack-workstream: [productivity, accounting, chief-of-staff, compliance, decision-playbooks, projects, recurring-summaries, sales, strategy, toolbox-maintenance]
  comms-confirm: [accounting, finance, reporting]
  office-files: [accounting, compliance, finance, reporting, sales]
  report-tieout: [accounting, chief-of-staff, process-engineering, reporting, personal, finance, projects]
  # The ERP read (migration plan, accounting): the ledger pull, trial balance, GL detail and
  # normalizer, the AR/AP hygiene and budget-detail checks, and the Sage Intacct reference.
  # Finance holds a copy since it converted.
  erp-ledger-pull: [accounting, finance]
  brand-guide: [marketing, learning, process-engineering, reporting]
  unslop: [marketing, accounting, chief-of-staff, finance, learning, process-engineering, productivity, projects, reporting, sales, software]
  unslop-deliverable: [marketing, finance, process-engineering, projects, reporting]
  unslop-editorial: [marketing, projects]
  unslop-email: [marketing, accounting, productivity, projects, sales, learning]
  unslop-proposal: [marketing, projects, sales]
  unslop-technical: [marketing, software]
  youtube-transcript: [obsidian, marketing]
  # The reviewer checklists (migration plan D4). Each lists only its source department until
  # the departments that use it convert; a department taking review-numbers also takes
  # report-tieout, whose command it runs.
  review-facts: [reporting, chief-of-staff, personal, compliance, process-engineering, sales, projects, decision-playbooks, learning, marketing]
  review-numbers: [reporting, chief-of-staff, personal, finance, accounting, process-engineering, projects]
  review-red-team: [reporting, chief-of-staff, finance, process-engineering, sales, projects, strategy, learning, marketing]
  review-completeness: [process-engineering, chief-of-staff, personal, compliance]
  evidence-check: [compliance, accounting]
  # Transcript cleanup and the one-transcript claim inventory (migration plan, process-engineering).
  transcript-tools: [process-engineering]
  # The automation backlog's file contract between process-engineering's scoping and sales'
  # proposal (migration plan D8): CSV columns, business-case headings, the issue-note standard.
  automation-backlog-format: [process-engineering, sales]
  # The goal audit's findings, closed action list and standalone walk of the Portal (migration
  # plan, strategy): strategy's goal alignment judges by it, projects' project-landscape runs it.
  goal-audit: [strategy, projects]
  # The read-only Portal research passes (a person, an email history, a domain), run by a
  # department's worker: productivity's jobs and the chief of staff's front door and cycle doers.
  portal-research: [productivity, chief-of-staff]
  # The rules every Portal write follows, loaded by the interactive skills that write.
  portal-write-safety: [productivity, projects, toolbox-maintenance]
